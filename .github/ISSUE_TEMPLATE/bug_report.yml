name: Bug report
description: Report a reproducible problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.
        Please include enough detail to reproduce the issue in a Docker setup.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Short description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact steps to reproduce from repo root
      placeholder: |
        1. docker compose up --build -d
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Paste command output, stack traces, or screenshots

  - type: input
    id: version
    attributes:
      label: Commit or branch
      description: Where this was observed
      placeholder: main / commit SHA
