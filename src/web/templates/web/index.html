<!DOCTYPE html>
<html lang="en">
  <head>
    {% load django_vite %}
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/branding/arxmedia/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ArxMedia - Track movies and shows you watch." />
    <meta name="theme-color" content="#9f42c6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArxMedia" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/web/apple-touch-icon.png" />
    <title>ArxMedia - Track What You Watch</title>
    <script>
      // Apply the theme before first paint (same rule as stores/theme.ts) to avoid a light flash in dark mode.
      try {
        const saved = localStorage.getItem('theme')
        const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (error) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    {% vite_hmr_client %}
    {% vite_asset 'src/main.ts' %}
  </head>
  <body>
    <div id="app">
      <!-- Painted until Vue mounts and replaces it. -->
      <div class="min-h-screen bg-surface" aria-busy="true"></div>
    </div>
  </body>
</html>
