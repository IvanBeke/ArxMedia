[project]
name = "arxmedia-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.0",
    "djangorestframework==3.18.0",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "dj-database-url==3.1.2",
    "redis==8.1.0",
    "django-redis==7.0.0",
    "gunicorn==26.0.0",
    "psycopg2-binary==2.9.12",
    "celery==5.6.3",
    "cryptography==50.0.0",
    "django-vite==3.1.0",
    "whitenoise==6.12.0",
    "django-stubs-ext==6.0.9",
    "django-stubs[compatible-mypy]==6.0.9",
    "djangorestframework-stubs[compatible-mypy]==3.17.1",
    "celery-types==0.26.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.2",
    "mypy==2.3.0"
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["migrations"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = "(^|/)migrations/"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "arxmedia.settings"
