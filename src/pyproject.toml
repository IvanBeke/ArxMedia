[project]
name = "arxmedia-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.1",
    "djangorestframework==3.18.1",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "dj-database-url==3.1.2",
    "redis==8.1.0",
    "django-redis==7.0.0",
    "gunicorn==26.2.0",
    "psycopg2-binary==2.9.13",
    "celery==5.6.3",
    "cryptography==50.0.1",
    "django-vite==3.2.0",
    "whitenoise==6.12.0",
    "django-stubs-ext==6.1.1",
    "celery-types==0.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "django-stubs[compatible-mypy]==6.1.1",
    "djangorestframework-stubs[compatible-mypy]==3.18.1",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["migrations", ".venv", "manage.py", "node_modules"]
src = ["."]

[tool.ruff.lint]
extend-select = ["DJ", "I", "UP", "B", "SIM", "RET", "PERF", "G"]
extend-ignore = ["EXE002", "BLE001"]
per-file-ignores = { "*/admin.py" = ["RUF012"], "*/models.py" = ["RUF012"], "*/serializers.py" = ["RUF012"], "*/views.py" = ["RUF012"], "*/views/*.py" = ["RUF012"] }

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = "(^|/)(migrations|\\.venv)/|(^|/)manage\\.py$"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

# Test files exercise behavior through DRF's test client, whose stubs type
# responses as plain Django (no .data, Client without force_authenticate).
# Source stays strict; tests are covered by execution instead.
[[tool.mypy.overrides]]
module = ["*.tests", "*.tests.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "arxmedia.settings"
