services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arxmedia}
      POSTGRES_USER: ${POSTGRES_USER:-arxmedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arxmedia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arxmedia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      DJANGO_VITE_DEV_MODE: ${DJANGO_VITE_DEV_MODE:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost}
      TMDB_API_KEY: ${TMDB_API_KEY}
      REDIS_URL: redis://redis:6379/0
      # DATABASE_URL is set in .env file (SQLite for dev, PostgreSQL for prod)
    volumes:
      - ./src:/app
      - media_files:/app/media_uploads
      - static_files:/app/staticfiles
    expose:
      - "8000"
    ports:
      - "8000:8000"
    command: >
      python manage.py runserver 0.0.0.0:8000

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    env_file: .env
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost}
      TMDB_API_KEY: ${TMDB_API_KEY}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./src:/app
      - media_files:/app/media_uploads
      - static_files:/app/staticfiles
    command: sh -c "celery -A arxmedia.celery worker --loglevel=info"

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    env_file: .env
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost}
      TMDB_API_KEY: ${TMDB_API_KEY}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./src:/app
      - media_files:/app/media_uploads
      - static_files:/app/staticfiles
    command: sh -c "celery -A arxmedia.celery beat --loglevel=info"

  ui:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./src/web:/workspace
    working_dir: /workspace/ui
    ports:
      - "5173:5173"
    command: >
      sh -lc "corepack enable &&
             corepack prepare pnpm@latest --activate &&
             pnpm install &&
             pnpm dev --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
  media_files:
  static_files:
